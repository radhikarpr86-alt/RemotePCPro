<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>HP Remote - Auto Connect</title>
  <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
  <style>
    :root {
      --bg: #0a0a14;
      --card: rgba(255,255,255,0.03);
      --accent: #ff5e62;
      --text: #e0e0e0;
      --text2: #999;
      --border: rgba(255,255,255,0.08);
      --radius: 16px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .app {
      max-width: 440px;
      width: 100%;
      text-align: center;
    }
    .icon-big { font-size: 60px; margin-bottom: 12px; }
    h1 {
      font-size: 24px;
      font-weight: 700;
      background: linear-gradient(135deg, #ff5e62, #ff9966);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 4px;
    }
    .subtitle { font-size: 12px; color: var(--text2); margin-bottom: 20px; }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      margin: 12px 0;
      text-align: left;
    }
    .card-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--text2);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      margin: 8px 0;
    }
    .status-badge.waiting { background: rgba(255,193,7,0.15); color: #ffc107; }
    .status-badge.connected { background: rgba(76,175,80,0.15); color: #4caf50; }
    .status-badge.error { background: rgba(244,67,54,0.15); color: #f44336; }

    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      display: inline-block;
    }
    .dot.green { background: #4caf50; animation: pulse 2s infinite; }
    .dot.yellow { background: #ffc107; animation: pulse 2s infinite; }
    .dot.red { background: #f44336; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin: 6px 0;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: white;
    }
    .btn:active { transform: scale(0.96); opacity: 0.9; }
    .btn-primary { background: linear-gradient(135deg, #ff5e62, #ff9966); }
    .btn-secondary { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); }
    .btn-danger { background: rgba(244,67,54,0.3); font-size: 13px; }

    .btn-row { display: flex; gap: 8px; }
    .btn-row .btn { flex: 1; }

    .file-list {
      max-height: 250px;
      overflow-y: auto;
      margin: 8px 0;
      border-radius: 10px;
      text-align: left;
    }
    .file-list::-webkit-scrollbar { width: 4px; }
    .file-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }

    .file-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      background: rgba(255,255,255,0.03);
      border-radius: 10px;
      margin: 4px 0;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .file-item .ficon { font-size: 24px; width: 30px; text-align: center; flex-shrink: 0; }
    .file-item .finfo { flex: 1; min-width: 0; }
    .file-item .fname {
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .file-item .fmeta { font-size: 10px; color: var(--text2); }
    .file-item .fdel {
      width: 28px; height: 28px;
      border-radius: 50%;
      background: rgba(244,67,54,0.2);
      border: none;
      color: #f44336;
      font-size: 14px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .empty-state {
      text-align: center;
      padding: 25px;
      color: var(--text2);
    }
    .empty-state .big-icon { font-size: 40px; opacity: 0.5; }

    .info-text {
      font-size: 10px;
      color: #555;
      margin-top: 8px;
      text-align: center;
    }

    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #333;
      color: white;
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 600;
      z-index: 999;
      animation: toastIn 0.3s ease, toastOut 0.3s ease 2s forwards;
      pointer-events: none;
    }
    @keyframes toastIn {
      from { opacity: 0; transform: translateX(-50%) translateY(20px); }
      to { opacity: 1; transform: translateX(-50%) translateY(0); }
    }
    @keyframes toastOut {
      from { opacity: 1; }
      to { opacity: 0; transform: translateX(-50%) translateY(-10px); }
    }
  </style>
</head>
<body>

  <div class="app">
    <div class="icon-big">📱</div>
    <h1>HP Remote</h1>
    <p class="subtitle">Auto-connect • Tanpa masukin ID</p>

    <!-- Status -->
    <div id="status-badge" class="status-badge waiting">
      <span class="dot yellow"></span> Menunggu laptop...
    </div>

    <!-- Card Pilih File -->
    <div class="card">
      <div class="card-title">📎 File yang Dibagikan</div>

      <div class="btn-row">
        <button class="btn btn-secondary" id="btn-file">📄 Pilih File</button>
        <button class="btn btn-secondary" id="btn-folder">📁 Folder</button>
      </div>

      <div class="file-list" id="file-list">
        <div class="empty-state">
          <div class="big-icon">📭</div>
          <p>Belum ada file</p>
        </div>
      </div>

      <button class="btn btn-danger" id="btn-clear" style="display:none;">🗑️ Hapus Semua</button>
    </div>

    <p class="info-text" id="info-id">ID: <span id="fixed-id">bang-remote-2024</span> (tertanam)</p>
    <p class="info-text">Jangan tutup halaman ini</p>
  </div>

  <input type="file" id="file-input" multiple style="display:none;" accept="*/*">
  <input type="file" id="folder-input" webkitdirectory style="display:none;">

  <script>
    // ============ KONFIGURASI ============
    // GANTI ID ini dengan ID unik kamu sendiri!
    const FIXED_ID = 'bang-remote-2024'; 
    // =====================================

    const peer = new Peer(FIXED_ID);
    let dataConnection = null;
    let sharedFiles = [];

    const $ = (id) => document.getElementById(id);
    const statusBadge = $('status-badge');
    const fileListEl = $('file-list');
    const fileInput = $('file-input');
    const folderInput = $('folder-input');
    const btnClear = $('btn-clear');
    const fixedIdEl = $('fixed-id');

    fixedIdEl.textContent = FIXED_ID;

    // ============ PEER EVENTS ============
    peer.on('open', (id) => {
      console.log('✅ Host siap, ID:', id);
      updateStatus('waiting', '⏳ Menunggu laptop...');
      showToast('🟢 Siap menerima koneksi');
    });

    peer.on('error', (err) => {
      console.error('Peer error:', err);
      updateStatus('error', '❌ Error: ' + err.message);
    });

    peer.on('disconnected', () => {
      updateStatus('waiting', '⚠️ Mencoba reconnect...');
      peer.reconnect();
    });

    // Terima koneksi
    peer.on('connection', (conn) => {
      dataConnection = conn;
      updateStatus('connected', '💻 Laptop terhubung!');
      showToast('💻 Laptop terhubung!');

      conn.on('data', (data) => handleCommand(data, conn));

      conn.on('close', () => {
        dataConnection = null;
        updateStatus('waiting', '⏳ Laptop terputus, menunggu...');
      });

      conn.on('error', (err) => {
        console.error('Connection error:', err);
      });
    });

    // ============ UI UPDATE ============
    function updateStatus(type, message) {
      statusBadge.className = 'status-badge ' + type;
      const dotClass = type === 'connected' ? 'green' : type === 'error' ? 'red' : 'yellow';
      statusBadge.innerHTML = `<span class="dot ${dotClass}"></span> ${message}`;
    }

    // ============ BUTTONS ============
    $('btn-file').onclick = () => fileInput.click();
    $('btn-folder').onclick = () => {
      if ('showDirectoryPicker' in window) {
        pickFolderModern();
      } else {
        folderInput.click();
      }
    };

    fileInput.onchange = async () => {
      await addFiles(Array.from(fileInput.files));
      fileInput.value = '';
    };

    folderInput.onchange = async () => {
      await addFiles(Array.from(folderInput.files));
      folderInput.value = '';
    };

    $('btn-clear').onclick = () => {
      if (confirm('Hapus semua file?')) {
        sharedFiles = [];
        renderFileList();
        showToast('🗑️ File dihapus');
      }
    };

    // ============ FILE FUNCTIONS ============
    async function pickFolderModern() {
      try {
        const dirHandle = await window.showDirectoryPicker();
        const files = [];
        for await (const [name, handle] of dirHandle.entries()) {
          if (handle.kind === 'file') {
            const file = await handle.getFile();
            files.push(file);
          }
        }
        await addFiles(files);
        showToast(`📁 ${dirHandle.name} ditambahkan`);
      } catch (e) {
        if (e.name !== 'AbortError') console.error(e);
      }
    }

    async function addFiles(files) {
      for (const file of files) {
        const exists = sharedFiles.find(f => f.name === file.name && f.size === file.size);
        if (exists) continue;
        if (file.size > 200 * 1024 * 1024) {
          showToast(`⚠️ ${file.name} terlalu besar`);
          continue;
        }
        const buffer = await file.arrayBuffer();
        sharedFiles.push({
          name: file.name,
          size: file.size,
          mime: file.type || 'application/octet-stream',
          data: buffer
        });
      }
      renderFileList();
      showToast(`✅ ${files.length} file ditambahkan`);
    }

    function deleteFile(index) {
      sharedFiles.splice(index, 1);
      renderFileList();
    }

    function getFileIcon(file) {
      const ext = (file.name.split('.').pop() || '').toLowerCase();
      if (file.mime.startsWith('image/')) return '🖼️';
      if (file.mime.startsWith('video/')) return '🎬';
      if (file.mime.startsWith('audio/')) return '🎵';
      const icons = {
        pdf: '📕', doc: '📄', docx: '📄', txt: '📃',
        xls: '📊', xlsx: '📊', ppt: '📽️', pptx: '📽️',
        zip: '🗜️', rar: '🗜️', '7z': '🗜️',
        apk: '📦', exe: '⚙️', html: '🌐', js: '⚡'
      };
      return icons[ext] || '📎';
    }

    function formatSize(bytes) {
      if (!bytes) return '0 B';
      const u = ['B', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(1024));
      return (bytes / Math.pow(1024, i)).toFixed(1) + ' ' + u[i];
    }

    function renderFileList() {
      if (sharedFiles.length === 0) {
        fileListEl.innerHTML = '<div class="empty-state"><div class="big-icon">📭</div><p>Belum ada file</p></div>';
        btnClear.style.display = 'none';
        return;
      }
      sharedFiles.sort((a, b) => a.name.localeCompare(b.name));
      fileListEl.innerHTML = sharedFiles.map((f, i) => `
        <div class="file-item">
          <span class="ficon">${getFileIcon(f)}</span>
          <div class="finfo">
            <div class="fname">${f.name}</div>
            <div class="fmeta">${formatSize(f.size)}</div>
          </div>
          <button class="fdel" onclick="deleteFile(${i})">✕</button>
        </div>
      `).join('');
      btnClear.style.display = 'block';
    }

    // ============ COMMAND HANDLER ============
    function handleCommand(cmd, conn) {
      if (cmd.type === 'list-files') {
        const list = sharedFiles.map((f, i) => ({
          index: i, name: f.name, size: f.size, mime: f.mime
        }));
        conn.send({ type: 'file-list', entries: list });
      } else if (cmd.type === 'download-file') {
        const idx = cmd.index;
        if (idx >= 0 && idx < sharedFiles.length) {
          const f = sharedFiles[idx];
          conn.send({ type: 'file-meta', name: f.name, size: f.size, mime: f.mime });
          const bytes = new Uint8Array(f.data);
          const chunkSize = 65536;
          let offset = 0;
          function sendChunk() {
            if (offset >= bytes.length) {
              conn.send({ type: 'file-chunk', done: true });
              return;
            }
            conn.send({ type: 'file-chunk', data: Array.from(bytes.slice(offset, offset + chunkSize)) });
            offset += chunkSize;
            setTimeout(sendChunk, 10);
          }
          sendChunk();
        }
      }
    }

    // ============ TOAST ============
    function showToast(msg) {
      const old = document.querySelector('.toast');
      if (old) old.remove();
      const t = document.createElement('div');
      t.className = 'toast';
      t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 2500);
    }
  </script>
</body>
</html>
